<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MusicFlow – Nghe nhạc trực tuyến chất lượng cao, playlist cá nhân hóa và AI DJ thông minh. Khám phá hàng ngàn bài hát yêu thích." />
    <title>MusicFlow – Nghe nhạc trực tuyến</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook / Zalo Metadata -->
    <meta property="og:type" content="music.song" />
    <meta property="og:site_name" content="MusicFlow" />
    <meta property="og:title" content="MusicFlow – Nghe nhạc trực tuyến chất lượng cao" />
    <meta property="og:description" content="Khám phá kho bài hát bản quyền chất lượng cao, bảng xếp hạng thịnh hành và AI DJ playlist trên MusicFlow." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1200&h=630&fit=crop" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MusicFlow Streaming" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MusicFlow – Nghe nhạc trực tuyến chất lượng cao" />
    <meta name="twitter:description" content="Khám phá kho bài hát bản quyền chất lượng cao, bảng xếp hạng thịnh hành và AI DJ playlist trên MusicFlow." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1200&h=630&fit=crop" />

    <!-- DNS prefetch + preconnect để tải Google Fonts nhanh hơn (không blocking render) -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload font CSS, sau đó load không blocking với media trick -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
